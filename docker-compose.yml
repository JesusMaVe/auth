# Servicios base. Toda la configuración sale de .env (ver .env.example);
# ${VAR:?} hace fallar a compose si falta una variable.
services:
  ldap:
    build: ./ldap
    environment:
      LDAP_BASE_DN: ${LDAP_BASE_DN:?LDAP_BASE_DN no definida}
      LDAP_ORG_NAME: ${LDAP_ORG_NAME:?LDAP_ORG_NAME no definida}
      LDAP_PORT: ${LDAP_PORT:?LDAP_PORT no definida}
      LDAP_SERVICE_CN: ${LDAP_SERVICE_CN:?LDAP_SERVICE_CN no definida}
      LDAP_DB_MAX_SIZE: ${LDAP_DB_MAX_SIZE:?LDAP_DB_MAX_SIZE no definida}
      LDAP_LOG_LEVEL: ${LDAP_LOG_LEVEL:?LDAP_LOG_LEVEL no definida}
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/ldap_admin_password
      LDAP_SERVICE_PASSWORD_FILE: /run/secrets/ldap_service_password
    secrets:
      - ldap_admin_password
      - ldap_service_password
    volumes:
      - ldapdata:/var/lib/openldap
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  auth-svc:
    build: ./auth-svc
    environment:
      AUTH_SVC_PORT: ${AUTH_SVC_PORT:?AUTH_SVC_PORT no definida}
      LOG_LEVEL: ${AUTH_SVC_LOG_LEVEL:?AUTH_SVC_LOG_LEVEL no definida}
      LDAP_URL: ldap://ldap:${LDAP_PORT:?LDAP_PORT no definida}
      LDAP_BIND_DN: cn=${LDAP_SERVICE_CN:?LDAP_SERVICE_CN no definida},ou=services,${LDAP_BASE_DN:?LDAP_BASE_DN no definida}
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_service_password
      LDAP_USERS_DN: ou=users,${LDAP_BASE_DN:?LDAP_BASE_DN no definida}
      LDAP_GROUPS_DN: ou=groups,${LDAP_BASE_DN:?LDAP_BASE_DN no definida}
      LDAP_STARTTLS: ${LDAP_STARTTLS:?LDAP_STARTTLS no definida}
      LDAP_TIMEOUT: ${LDAP_TIMEOUT:?LDAP_TIMEOUT no definida}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER no definida}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE no definida}
      JWT_TTL: ${JWT_TTL:?JWT_TTL no definida}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:?RATE_LIMIT_PER_MINUTE no definida}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:?RATE_LIMIT_BURST no definida}
      # Solo nginx (IP fija en la red compartida): el gateway de la red también está en la subnet
      # y es de donde llega el tráfico de los puertos publicados, así que confiar en toda la subnet
      # haría que auth-svc registrara la IP de nginx como la del cliente.
      TRUSTED_PROXIES: ${WEB_PROXY_IP:?WEB_PROXY_IP no definida}/32
    secrets:
      - ldap_service_password
      - jwt_private_key
    depends_on:
      ldap:
        condition: service_healthy
    networks:
      - default
      - shared
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

# Archivos generados desde .env por `make secrets` (secrets/ está en .gitignore).
secrets:
  ldap_admin_password:
    file: ./secrets/ldap_admin_password
  ldap_service_password:
    file: ./secrets/ldap_service_password
  jwt_private_key:
    file: ./secrets/jwt_private_key

volumes:
  ldapdata:

networks:
  shared:
    name: ${SHARED_NETWORK:?SHARED_NETWORK no definida}
    external: true
